name: Pages

# Site de test : https://pauldoazan.github.io/gambette/
on:
  push:
    branches: [main, feat/passe-trappe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Site servi sous /gambette/ (page de projet GitHub).
      - run: pnpm --filter @gambette/web build
        env:
          NUXT_APP_BASE_URL: /gambette/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
